[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-harness"
version = "1.1.1"
description = "A unified toolkit for integrating, benchmarking, and comparing OCR engines with modular preprocessing and evaluation."
readme = "README-PyPI.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Royee Yosibash" }]
dependencies = [
    "datasets==4.5.0",
    "matplotlib>=3.10.0",
    "numpy==2.4.2",
    "opencv-python-headless==4.13.0.92",
    "pillow==12.1.0",
    "scipy>=1.17.0",
]

[project.urls]
Homepage = "https://github.com/Royee-Yosibash/OCR-Harness"
Repository = "https://github.com/Royee-Yosibash/OCR-Harness"
Issues = "https://github.com/Royee-Yosibash/OCR-Harness/issues"

[project.optional-dependencies]
ocrs = [
    "easyocr==1.7.2",
    "paddleocr>=3.4.0",
    "paddlepaddle==3.2.0",
    "pytesseract>=0.3.10",
]

[dependency-groups]
dev = [
    "pre-commit",
    "pytest",
    "ruff>=0.15.0",
    "flask>=3.0",
    "pytest-playwright>=0.7.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ocr_harness*"]

[tool.ocr-harness]
release-date = "2026-10-15"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # bugbear
    "A",   # builtins shadowing
    "SIM", # simplify
    "C4",  # comprehensions
    "RET", # return statements
    "ARG", # unused arguments
    "RUF", # ruff-specific
    "D",   # pydocstyle (google convention)
]
ignore = [
    "D100", # missing docstring in public module
    "D102", # missing docstring in public method (overrides inherit docs from base)
    "D104", # missing docstring in public package
    "D107", # missing docstring in __init__ (documented in class docstring)
]

[tool.ruff.lint.pydocstyle]
convention = "google"
ignore-decorators = ["property"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D102", "D103"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
