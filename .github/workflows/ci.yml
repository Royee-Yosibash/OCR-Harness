name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check

  formatting-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: format --check

  version-bump-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version and date were bumped
        run: |
          PR_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          PR_DATE=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['tool']['ocr-harness']['release-date'])")
          MAIN_VERSION=$(git show origin/main:pyproject.toml | python3 -c "import tomllib,sys; print(tomllib.load(sys.stdin.buffer)['project']['version'])" 2>/dev/null || echo "1.0.0")
          MAIN_DATE=$(git show origin/main:pyproject.toml | python3 -c "import tomllib,sys; print(tomllib.load(sys.stdin.buffer)['tool']['ocr-harness']['release-date'])" 2>/dev/null || echo "2026-09-06")
          echo "PR version: $PR_VERSION (date: $PR_DATE)"
          echo "Main version: $MAIN_VERSION (date: $MAIN_DATE)"
          python3 -c "
          from datetime import datetime
          from packaging.version import Version

          pr_ver, main_ver = Version('$PR_VERSION'), Version('$MAIN_VERSION')
          if pr_ver <= main_ver:
              raise SystemExit(f'Version must be bumped. PR={pr_ver} <= main={main_ver}')

          pr_date = datetime.strptime('$PR_DATE', '%Y-%m-%d')
          main_date = datetime.strptime('$MAIN_DATE', '%Y-%m-%d')
          if pr_date < main_date:
              raise SystemExit(f'Release date must not be behind main. PR=$PR_DATE < main=$MAIN_DATE')

          print(f'Version bump OK: {main_ver} -> {pr_ver}')
          print(f'Date bump OK: $MAIN_DATE -> $PR_DATE')
          "

  unit-tests-and-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Install package
        run: |
          pip install torch==2.13.0 torchvision==0.28.0
          pip install -e ".[full]"

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run tests
        run: python -m tests.tests_runner

      - name: Run evaluation pipeline
        run: python -m scripts.run_evaluation
